openapi: 3.1.0
info:
  title: Inventory API
  version: 1.0.0
paths:
  /api/v1/inventory/{productId}:
    get:
      summary: Get inventory by product
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Inventory returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
  /api/v1/inventory/{productId}/adjust:
    post:
      summary: Adjust stock
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustInput'
      responses:
        '200':
          description: Stock adjusted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
  /api/v1/inventory/reserve:
    post:
      summary: Reserve inventory for order
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id:
                  type: string
                  format: uuid
              required: [order_id]
      responses:
        '200':
          description: Reservation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    StandardResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          nullable: true
        error:
          nullable: true
        trace_id:
          type: string
          format: uuid
    AdjustInput:
      type: object
      properties:
        quantity:
          type: integer
        reason:
          type: string

