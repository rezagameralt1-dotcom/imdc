name: CI/php-tests

on:
  push:
    branches: [ main, codex/** ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    services: {} # sqlite in-memory, نیاز به سرویس DB نیست

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_sqlite, bcmath, gd, xml
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Framework Folders
        run: |
          mkdir -p storage/framework/{cache,sessions,testing,views}
          mkdir -p bootstrap/cache
          chmod -R 777 storage bootstrap/cache

      - name: App Key & Config (testing)
        env:
          APP_ENV: testing
        run: |
          # اگر .env.testing هست، لاراول خودش برش می‌داره؛ فقط key نیاز داریم
          php artisan key:generate --env=testing
          php artisan optimize:clear
          php artisan permission:cache-reset || true

      - name: Run Tests (SQLite in-memory)
        env:
          APP_ENV: testing
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test -v
