name: CI/php-tests

on:
  push:
    branches: [ main, codex/** ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      # کلید ثابت برای تست‌ها (32 بایت base64)
      APP_KEY: base64:WnVfZ0V5Qk9rT0tLUmVhZHlUZXN0S2V5MzJieXRlcw==
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_sqlite, bcmath, gd, xml, fileinfo
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Framework Folders
        run: |
          mkdir -p storage/framework/{cache,sessions,testing,views}
          mkdir -p bootstrap/cache
          chmod -R 777 storage bootstrap/cache

      - name: Clear & Reset Permission Cache
        run: |
          php artisan optimize:clear
          php artisan permission:cache-reset || true

      - name: Run Tests (sqlite in-memory)
        run: php artisan test -v
